[project]
name = "jev-vs-polymarket"
version = "0.1.0"
description = "Probe Jev calibration on resolved Polymarket forecasting questions."
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "matplotlib",
    "typesafe-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
jev-polymarket = "jev_vs_polymarket.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_vs_polymarket"]
